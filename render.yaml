services:
  - type: web
    name: dating-itinerary-builder-backend
    env: docker
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1
